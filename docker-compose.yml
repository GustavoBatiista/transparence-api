version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: transparence-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: transparence
      MYSQL_USER: transparence
      MYSQL_PASSWORD: transparence
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
